name: Sync public portfolio

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-public-portfolio
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ryeceps/ryeceps.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh public repository snapshot
        run: npm run sync:repos
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test
      - name: Publish changes
        id: publish
        run: |
          if git diff --quiet -- index.html projects.html data/public-repositories.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects.html data/public-repositories.json
          git commit -m "chore: consecrate the public repository index"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request Pages build
        if: steps.publish.outputs.changed == 'true'
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ github.token }}
